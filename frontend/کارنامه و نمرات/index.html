<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>کارنامه و نمرات</title>

    <link rel="stylesheet" href="style.css">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="/static/amoozeshyar/yekan-bakh.css">
</head>

<body>

    <!-- =========================
         SIDEBAR
    ========================== -->

    <div class="sidebar">

        <nav class="menu">

            <div class="icon-box">
                <img src="./assets/images/لوگو.png" alt="آموزشیار">
                <img src="./assets/images/آمورشیار.png">
            </div>

            <ul>

                <li>
                    <a href="/dashboard/">
                        <i class="fas fa-tachometer-alt"></i>
                        <span>داشبورد</span>
                    </a>
                </li>

                <li>
                    <a href="/teachers/">
                        <i class="fas fa-chalkboard-teacher"></i>
                        <span>معرفی اساتید</span>
                    </a>
                </li>

                <li>
                    <a href="/course-selection/">
                        <i class="fas fa-book-open"></i>
                        <span>انتخاب واحد</span>
                    </a>
                </li>

                <li>
                    <a href="/add-drop/">
                        <i class="fas fa-plus-minus"></i>
                        <span>حذف و اضافه</span>
                    </a>
                </li>

                <li>
                    <a href="/course-selection/">
                        <i class="fas fa-search"></i>
                        <span>جستجوی دروس</span>
                    </a>
                </li>

                <li>
                    <a href="/emergency-removal/">
                        <i class="fas fa-trash-alt"></i>
                        <span>حذف اضطراری</span>
                    </a>
                </li>

                <li>
                    <a href="/full-transcript/">
                        <i class="fas fa-chart-line"></i>
                        <span>کارنامه کلی</span>
                    </a>
                </li>

                <li>
                    <a href="/grade-objection/">
                        <i class="fas fa-comment-dots"></i>
                        <span>اعتراض به نمره</span>
                    </a>
                </li>

                <li>
                    <a href="/financial/">
                        <i class="fas fa-coins"></i>
                        <span>امور مالی</span>
                    </a>
                </li>

            </ul>

        </nav>

        <div class="logout">
            <a href="/logout/">
                <i class="fas fa-sign-out-alt"></i>
                <span>خروج از سیستم</span>
            </a>
        </div>

    </div>

    <!-- =========================
         MAIN CONTENT
    ========================== -->

    <div class="main-content">

        <!-- HEADER -->

        <header class="header">

            <div class="header-left">

                <div class="cancel-icon">
                    <img src="./assets/images/cancel.png">
                </div>

                <div class="notification-icon">
                    <img src="./assets/images/bell-notification.png">
                </div>

            </div>

            <div class="header-right">

                <div class="user-details">
                    <h3 class="student-name">نام دانشجو</h3>

                    <p class="student-id">
                        شماره دانشجویی : 123456789
                    </p>
                </div>

                <div class="user-avatar">
                    <img src="./assets/images/Avatar.png">
                </div>

            </div>

        </header>

        <!-- =========================
             PAGE TITLE
        ========================== -->

        <section class="grades-page">

            <div class="page-title-wrapper">
                <h1 class="page-title">
                    کارنامه و نمرات
                </h1>
            </div>

            <!-- =========================
                 CARDS
            ========================== -->

            <div class="grades-cards">

                <!-- CARD 1 -->

                <a href="semester-report.html" class="grade-card">

                    <div class="card-icon purple">
                        <i class="fas fa-chart-bar"></i>
                    </div>

                    <div class="card-content">
                        <h3>کارنامه نیمسال جاری</h3>
                    </div>

                </a>

                <!-- CARD 2 -->

                <a href="#" class="grade-card">

                    <div class="card-icon blue">
                        <i class="far fa-star"></i>
                    </div>

                    <div class="card-content">
                        <h3>مشاهده کارنامه دانشجویی</h3>
                    </div>

                </a>

            </div>

        </section>

    </div>


<script src="/static/amoozeshyar/auth.js"></script>
<script>initProtectedPage();</script>

</body>

</html>
