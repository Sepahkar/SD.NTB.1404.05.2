<div class="main-content">
    <header class="header">
        <div class="header-left">
            <div class="cancel-icon">
                <img src="./assets/images/cancel.png">

        </div>

            <div class="user-details">
                <h3 class="student-name">حمیدرضا شیدایی</h3>

                    <p class="student-id">شماره دانشجویی: 123456789</p>

<!-- فقط بخش main را نشان می‌دهم، بقیه ساختار مثل قبل -->
      <main class="page-content form-page">
          <h1 class="page-title">اعتراض به نمره</h1>
          <div class="card">
              <div class="form-grid">
                  <div class="form-field">
                      <label>درس :</label>
                      <div class="field-input">
                          <div class="display-box">توسعه نرم افزار</div>
                      </div>
                  </div>
                  <div class="form-field">
                      <label>متن اعتراض :</label>
                      <div class="field-input">
                          <textarea id="objectionText" placeholder="متن اعتراض خود را وارد کنید ..." rows="6"></textarea>
                      </div>
                  </div>
              </div>
              <div class="form-actions">
                  <button class="btn-accent" onclick="submitForm()">ثبت اعتراض</button>
                  <a href="page1-grade-objection.html" class="btn-ghost">انصراف</a>
              </div>
          </div>
      </main>
</div>

<div id="toast" class="toast">✅ اعتراض شما با موفقیت ثبت شد</div>

<script>
    function submitForm() {
        const textarea = document.getElementById('objectionText');
        const text = textarea.value.trim();
        if (!text) {
            textarea.style.borderColor = '#DC2626';
            textarea.focus();
            return;
        }
        textarea.style.borderColor = '';
        const toast = document.getElementById('toast');
        toast.classList.add('show');
        setTimeout(() => {
            toast.classList.remove('show');
            window.location = 'page1-grade-objection.html';
        }, 2000);
    }
</script>
