<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>انتخاب واحد | آموزشیار</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="/static/amoozeshyar/yekan-bakh.css">
    <link rel="stylesheet" href="/static/amoozeshyar/student-panel.css">
</head>
<body class="student-panel">
    <div class="sidebar">
        <nav class="menu">
            <div class="icon-box">
                <img src="./assets/images/لوگو.png" alt="آموزشیار">
                <img src="./assets/images/آمورشیار.png">
            </div>
            <ul>
                <li><a href="/dashboard/"><i class="fas fa-tachometer-alt"></i> <span>داشبورد</span></a></li>
                <li><a href="/teachers/"><i class="fas fa-chalkboard-teacher"></i> <span>معرفی اساتید</span></a></li>
                <li><a href="/course-selection/"><i class="fas fa-book-open"></i> <span>انتخاب واحد</span></a></li>
                <li><a href="/add-drop/"><i class="fas fa-plus-minus"></i> <span>حذف و اضافه</span></a></li>
                <li><a href="/course-search/"><i class="fas fa-search"></i> <span>جستجوی دروس</span></a></li>
                <li><a href="/emergency-removal/"><i class="fas fa-trash-alt"></i> <span>حذف اضطراری</span></a></li>
                <li><a href="/full-transcript/"><i class="fas fa-chart-line"></i> <span>کارنامه کلی</span></a></li>
                <li><a href="/grade-objection/"><i class="fas fa-comment-dots"></i> <span>اعتراض به نمره</span></a></li>
                <li><a href="/financial/"><i class="fas fa-coins"></i> <span>امور مالی</span></a></li>
            </ul>
        </nav>
        <div class="logout">
            <a href="/logout/"><i class="fas fa-sign-out-alt"></i> <span>خروج از سیستم</span></a>
        </div>
    </div>

    <div class="main-content">
        <header class="header">
            <div class="header-left">
                <div class="cancel-icon"><img src="./assets/images/cancel.png" alt=""></div>
                <div class="notification-icon"><img src="./assets/images/bell-notification.png" alt=""></div>
            </div>
            <div class="header-right">
                <div class="user-details">
                    <h3 class="student-name">نام دانشجو</h3>
                    <div class="user-meta">
                        <p class="student-id">شماره دانشجویی: 123456789</p>
                    </div>
                </div>
                <div class="user-avatar">
                    <img src="./assets/images/Avatar.png" alt="">
                </div>
            </div>
        </header>

        <div class="unit-selection">
            <h1 class="page-title">پنل انتخاب واحد</h1>
            <div id="form-error" class="hub-error"></div>
            <div class="unit-grid">
                <div class="unit-card" id="course-available-card">
                    <div class="unit-card-title">
                        <span>دروس قابل اخذ</span>
                        <i class="fas fa-plus-circle"></i>
                    </div>
                    <div id="available-offers-list"></div>
                </div>
                <div class="unit-card" id="course-enrolled-card">
                    <div class="unit-card-title">
                        <span>دروس انتخاب شده</span>
                        <i class="fas fa-list"></i>
                    </div>
                    <table class="unit-table">
                        <thead>
                            <tr>
                                <th>کد درس</th>
                                <th>عنوان درس</th>
                                <th>استاد</th>
                                <th>زمان</th>
                                <th>واحد</th>
                            </tr>
                        </thead>
                        <tbody id="enrolled-offers-body"></tbody>
                    </table>
                    <div class="unit-footer">
                        <span>تعداد کل دروس: <strong id="enrolled-count">0</strong></span>
                        <span>ترم: <strong id="enrolled-term">—</strong></span>
                    </div>
                </div>
            </div>
        </div>
    </div>

<script src="/static/amoozeshyar/api-client.js"></script>
<script src="/static/amoozeshyar/utils.js"></script>
<script src="/static/amoozeshyar/nav.js"></script>
<script src="/static/amoozeshyar/notifications.js"></script>
<script src="/static/amoozeshyar/auth.js"></script>
<script src="/static/amoozeshyar/pages/forms.js"></script>
<script>initProtectedPage(); initCourseSelectionPage();</script>
</body>
</html>
